<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Imperial Pompeian Carmine Background Gradient -->
    <radialGradient id="bgGrad" cx="30%" cy="25%" r="85%">
      <stop offset="0%" stop-color="#9e301a"/>
      <stop offset="55%" stop-color="#701e0f"/>
      <stop offset="100%" stop-color="#320a04"/>
    </radialGradient>

    <!-- Classical Antique Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faebd2"/>
      <stop offset="30%" stop-color="#e8c668"/>
      <stop offset="70%" stop-color="#caa035"/>
      <stop offset="100%" stop-color="#9a7018"/>
    </linearGradient>

    <!-- Drop Shadow for Dimensional Medallion -->
    <filter id="medallionShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>

  <!-- Concentric Gold Filigree Border -->
  <rect x="25" y="25" width="462" height="462" rx="88" fill="none" stroke="url(#goldGrad)" stroke-width="4.5" stroke-opacity="0.75"/>

  <!-- Equinox (Aequinoctium) Medallion -->
  <g filter="url(#medallionShadow)">
    <!-- Sun Rays (9 Radiant Classical Solar Rays on Left Hemisphere) -->
    <!-- Ray 1 (top-left 108 deg): tip at (190, 60) -->
    <polygon points="209,112 190,60 215,116" fill="url(#goldGrad)"/>
    <!-- Ray 2 (126 deg): tip at (147, 95) -->
    <polygon points="171,137 134,107 163,148" fill="url(#goldGrad)"/>
    <!-- Ray 3 (144 deg): tip at (83, 167) -->
    <polygon points="138,172 83,167 131,183" fill="url(#goldGrad)"/>
    <!-- Ray 4 (162 deg): tip at (81, 209) -->
    <polygon points="116,214 81,209 114,226" fill="url(#goldGrad)"/>
    <!-- Ray 5 (Horizontal Center / 180 deg) -->
    <polygon points="105,243 45,256 105,269" fill="url(#goldGrad)"/>
    <!-- Ray 6 (198 deg): tip at (81, 303) -->
    <polygon points="114,286 81,303 116,298" fill="url(#goldGrad)"/>
    <!-- Ray 7 (216 deg): tip at (83, 345) -->
    <polygon points="131,329 83,345 138,340" fill="url(#goldGrad)"/>
    <!-- Ray 8 (234 deg): tip at (147, 417) -->
    <polygon points="163,364 134,405 171,375" fill="url(#goldGrad)"/>
    <!-- Ray 9 (bottom-left 252 deg): tip at (190, 452) -->
    <polygon points="215,396 190,452 209,400" fill="url(#goldGrad)"/>

    <!-- RIGHT HEMISPHERE: Night Sky (Nox) -->
    <path d="M 256,105 A 151,151 0 0,1 256,407 Z" fill="#120403"/>

    <!-- Crescent Moon (Luna) in Right Hemisphere -->
    <path d="M 325.5,157.8 C 389,198.6 389,313.4 325.5,354.2 C 349.6,304.4 349.6,207.6 325.5,157.8 Z" fill="url(#goldGrad)"/>

    <!-- Major Star of Night (8-pointed Stella) at (289, 256) -->
    <path d="M 289,221 Q 289,256 324,256 Q 289,256 289,291 Q 289,256 254,256 Q 289,256 289,221 Z" fill="url(#goldGrad)"/>
    <path d="M 264,231 L 314,281 M 314,231 L 264,281" stroke="url(#goldGrad)" stroke-width="2.5"/>

    <!-- Minor Stars of Night Sky -->
    <path d="M 289,165 Q 289,177 301,177 Q 289,177 289,189 Q 289,177 277,177 Q 289,177 289,165 Z" fill="url(#goldGrad)"/>
    <path d="M 289,323 Q 289,335 301,335 Q 289,335 289,347 Q 289,335 277,335 Q 289,335 289,323 Z" fill="url(#goldGrad)"/>

    <!-- LEFT HEMISPHERE: Day Sun Disc (Dies / Sol) -->
    <path d="M 256,105 A 151,151 0 0,0 256,407 Z" fill="url(#goldGrad)"/>

    <!-- Engraved Arc Ring on Sun Face -->
    <path d="M 256,150 A 106,106 0 0,0 256,362" fill="none" stroke="#8c2310" stroke-width="3" stroke-opacity="0.6"/>

    <!-- Outer Rim Circle (Full 360 degree circle) -->
    <circle cx="256" cy="256" r="151" fill="none" stroke="url(#goldGrad)" stroke-width="4.5"/>

    <!-- Vertical Meridian Axis (The 50/50 Equinox Balance Axis) -->
    <line x1="256" y1="96" x2="256" y2="416" stroke="url(#goldGrad)" stroke-width="5" stroke-linecap="round"/>
    <circle cx="256" cy="96" r="6" fill="url(#goldGrad)"/>
    <circle cx="256" cy="416" r="6" fill="url(#goldGrad)"/>
  </g>
</svg>
