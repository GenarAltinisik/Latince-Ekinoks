<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="carmineGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9b301a"/>
      <stop offset="40%" stop-color="#8c2d19"/>
      <stop offset="100%" stop-color="#461208"/>
    </linearGradient>
    <linearGradient id="goldBorder" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#faebd2" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#d4af37" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#9a741e" stop-opacity="0.75"/>
    </linearGradient>
    <filter id="subtleShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1.2" stdDeviation="1.0" flood-color="#140301" flood-opacity="0.55"/>
    </filter>
  </defs>

  <!-- Background Squircle with Classical Roman Carmine Gradient -->
  <rect x="0" y="0" width="64" height="64" rx="14" fill="url(#carmineGrad)"/>

  <!-- Concentric Inner Golden Hairline Border -->
  <rect x="3" y="3" width="58" height="58" rx="11" fill="none" stroke="url(#goldBorder)" stroke-width="1.4"/>

  <!-- Classical Latin Ash Ligature (Æ) with Center Alignment -->
  <text x="32" y="34" 
        font-family="'Gentium Plus', 'EB Garamond', 'Cardo', 'Georgia', 'Times New Roman', serif" 
        font-size="36" 
        font-weight="700" 
        fill="#ffffff" 
        text-anchor="middle" 
        dominant-baseline="central" 
        filter="url(#subtleShadow)">Æ</text>
</svg>
